name: Test Action

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create minimal test game
        run: |
          mkdir -p test-game/game
          cat << 'EOF' > test-game/game/script.rpy
          define s = Character("Tester")
          label start:
              s "Hello from automated test!"
              return
          EOF
          cat << 'EOF' > test-game/game/options.rpy
          define config.name = "Test Game"
          define config.version = "1.0"
          define build.name = "testgame"
          EOF

      - name: Test Ren'Py CI Action (with Steam support)
        uses: ./
        with:
          renpy-version: '8.5.2'
          game-dir: 'test-game'
          install-steam: 'true'
          lint: 'true'
          compile: 'true'
          build: 'true'
          upload-artifact: 'true'
          artifact-name: 'test-game-build'
