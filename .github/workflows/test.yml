name: Test Action

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Ren'Py CI Action (with Steam support)
        uses: ./
        with:
          renpy-version: '8.5.2'
          game-dir: 'test-game'
          install-steam: 'true'
          lint: 'true'
          compile: 'true'
          build: 'true'
          upload-artifact: 'true'
          artifact-name: 'test-game-build'
