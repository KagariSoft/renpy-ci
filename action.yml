name: 'RenPy CI'
description: "Setup, lint, compile, build, and publish Ren'Py games to GitHub Releases, itch.io, and Steam."
author: 'KagariSoft'

branding:
  icon: 'play-circle'
  color: 'purple'

inputs:
  renpy-version:
    description: "Ren'Py SDK version to download and use."
    required: false
    default: '8.5.3'

  game-dir:
    description: 'Path to the RenPy game directory (containing game/ folder or project root).'
    required: false
    default: '.'

  install-steam:
    description: 'Whether to download and install the Steam support library into the SDK.'
    required: false
    default: 'false'

  lint:
    description: 'Run renpy lint before building.'
    required: false
    default: 'true'

  compile:
    description: 'Run renpy compile before building.'
    required: false
    default: 'true'

  build:
    description: 'Run renpy distribute to build distribution packages.'
    required: false
    default: 'true'

  package:
    description: 'Specific distribution package(s) to build (e.g. pc, linux, mac, market). Leave empty to build all.'
    required: false
    default: ''

  destination:
    description: 'Custom destination directory for built distributions.'
    required: false
    default: ''

  upload-artifact:
    description: 'Upload the built distribution directory as a GitHub Actions workflow artifact.'
    required: false
    default: 'true'

  artifact-name:
    description: 'Name of the uploaded artifact.'
    required: false
    default: 'renpy-build'

  # GitHub Releases
  create-release:
    description: 'Automatically publish the built packages to a GitHub Release.'
    required: false
    default: 'false'

  release-tag:
    description: 'Git tag for the release. Defaults to the triggered tag or branch name.'
    required: false
    default: ''

  release-name:
    description: 'Name/title for the GitHub Release.'
    required: false
    default: ''

  release-body:
    description: 'Markdown release notes/description. Leave empty to automatically generate from commits.'
    required: false
    default: ''

  release-draft:
    description: 'Create the release as an unpublished draft.'
    required: false
    default: 'false'

  release-prerelease:
    description: 'Mark the release as a prerelease.'
    required: false
    default: 'false'

  github-token:
    description: 'GitHub token with permission to create releases.'
    required: false
    default: ${{ github.token }}

  # itch.io (Butler)
  publish-itch:
    description: 'Publish built distributions to itch.io using Butler CLI.'
    required: false
    default: 'false'

  itch-target:
    description: 'itch.io target project in "user/game" format. Defaults to build.itch_project if defined in game scripts.'
    required: false
    default: ''

  itch-channel:
    description: 'itch.io channel name. If omitted, channel is auto-detected from each package suffix.'
    required: false
    default: ''

  itch-userversion:
    description: 'Version string to report to itch.io. Defaults to release-tag or GITHUB_REF_NAME.'
    required: false
    default: ''

  butler-key:
    description: 'Butler API key / secret for authenticating with itch.io.'
    required: false
    default: ''

  # Steam (SteamPipe & DRM)
  publish-steam:
    description: 'Publish built game to Steam via SteamPipe (SteamCMD).'
    required: false
    default: 'false'

  steam-appid:
    description: 'Steam Application ID.'
    required: false
    default: ''

  steam-depot-id:
    description: 'Steam Depot ID.'
    required: false
    default: ''

  steam-username:
    description: 'Steam account username for authentication.'
    required: false
    default: ''

  steam-password:
    description: 'Steam account password for authentication.'
    required: false
    default: ''

  steam-guard-code:
    description: 'Optional Steam Guard code (2FA).'
    required: false
    default: ''

  steam-branch:
    description: 'Optional beta branch name to set live (setlive).'
    required: false
    default: ''

  steam-desc:
    description: 'Build description for Steam build history.'
    required: false
    default: ''

  steam-wrap-drm:
    description: 'Apply Steam DRM wrapper to the Windows executable before uploading.'
    required: false
    default: 'false'

  steam-drm-flags:
    description: 'DRM tool flags (0=default, 6=compatibility, 32=silent, 38=compat+silent).'
    required: false
    default: '6'

  steam-content-root:
    description: 'Custom directory with uncompressed game files to upload. If omitted, auto-detected from build output.'
    required: false
    default: ''

outputs:
  sdk-path:
    description: 'Path to the installed RenPy SDK.'
    value: ${{ steps.setup-renpy.outputs.sdk-path }}

  dist-path:
    description: 'Directory where distributions were generated.'
    value: ${{ steps.build-dist.outputs.dist-path }}

  release-url:
    description: 'URL of the created GitHub Release (if release was enabled).'
    value: ${{ steps.publish-release.outputs.release-url }}

runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        echo "::group::Installing Ren'Py system dependencies"
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          python3 \
          python3-pip \
          unzip \
          wget \
          curl \
          tar \
          bzip2 \
          libgl1 \
          libxinerama1 \
          libxcursor1 \
          libxrandr2 \
          libxi6 \
          libpulse0 || true

        sudo apt-get install -y -qq libasound2t64 2>/dev/null || sudo apt-get install -y -qq libasound2 2>/dev/null || true
        echo "::endgroup::"

    - name: Setup Ren'Py SDK
      id: setup-renpy
      shell: bash
      run: |
        echo "::group::Downloading Ren'Py SDK ${{ inputs.renpy-version }}"
        VERSION="${{ inputs.renpy-version }}"
        SDK_DIR="$RUNNER_TEMP/renpy-${VERSION}-sdk"

        if [ ! -f "$SDK_DIR/renpy.sh" ]; then
          mkdir -p "$RUNNER_TEMP"
          ARCHIVE_PATH="$RUNNER_TEMP/renpy-${VERSION}-sdk.tar.bz2"
          
          echo "Downloading from https://www.renpy.org/dl/${VERSION}/renpy-${VERSION}-sdk.tar.bz2"
          wget -q --show-progress "https://www.renpy.org/dl/${VERSION}/renpy-${VERSION}-sdk.tar.bz2" -O "$ARCHIVE_PATH"
          
          echo "Extracting SDK..."
          tar -xjf "$ARCHIVE_PATH" -C "$RUNNER_TEMP"
          rm -f "$ARCHIVE_PATH"
        else
          echo "Ren'Py SDK already available at $SDK_DIR"
        fi

        chmod +x "$SDK_DIR/renpy.sh"
        echo "sdk-path=$SDK_DIR" >> $GITHUB_OUTPUT
        echo "RENPY_SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
        echo "::endgroup::"

    - name: Install Steam Support
      if: ${{ inputs.install-steam == 'true' }}
      shell: bash
      run: |
        echo "::group::Installing Steam Support Library"
        VERSION="${{ inputs.renpy-version }}"
        STEAM_ZIP="$RUNNER_TEMP/renpy-${VERSION}-steam.zip"
        
        echo "Downloading Steam SDK from http://update.renpy.org/${VERSION}/renpy-${VERSION}-steam.zip"
        wget -q --show-progress "http://update.renpy.org/${VERSION}/renpy-${VERSION}-steam.zip" -O "$STEAM_ZIP"
        
        echo "Extracting into $RENPY_SDK_DIR..."
        unzip -o -q "$STEAM_ZIP" -d "$RENPY_SDK_DIR"
        rm -f "$STEAM_ZIP"
        echo "Steam libraries installed successfully."
        echo "::endgroup::"

    - name: Lint Project
      if: ${{ inputs.lint == 'true' }}
      shell: bash
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        RENPY_SKIP_UPDATE_CHECK: "1"
      run: |
        echo "::group::Running Ren'Py Lint"
        "$RENPY_SDK_DIR/renpy.sh" "${{ inputs.game-dir }}" lint
        echo "::endgroup::"

    - name: Compile Project
      if: ${{ inputs.compile == 'true' }}
      shell: bash
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        RENPY_SKIP_UPDATE_CHECK: "1"
      run: |
        echo "::group::Compiling Ren'Py Project"
        "$RENPY_SDK_DIR/renpy.sh" "${{ inputs.game-dir }}" compile
        echo "::endgroup::"

    - name: Build Distributions
      id: build-dist
      if: ${{ inputs.build == 'true' }}
      shell: bash
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        RENPY_SKIP_UPDATE_CHECK: "1"
      run: |
        echo "::group::Building Distributions"
        ARGS=("$RENPY_SDK_DIR/renpy.sh" "$RENPY_SDK_DIR/launcher" distribute "${{ inputs.game-dir }}")

        if [ -n "${{ inputs.package }}" ]; then
          ARGS+=(--package "${{ inputs.package }}")
        fi

        if [ -n "${{ inputs.destination }}" ]; then
          ARGS+=(--destination "${{ inputs.destination }}")
        fi

        "${ARGS[@]}"

        DIST_DIR=""
        if [ -n "${{ inputs.destination }}" ] && [ -d "${{ inputs.destination }}" ]; then
          DIST_DIR="${{ inputs.destination }}"
        else
          DIST_DIR=$(find . -maxdepth 3 -type d -name "*-dists" | head -n 1)
        fi

        if [ -n "$DIST_DIR" ] && [ -d "$DIST_DIR" ]; then
          RESOLVED_DIST=$(cd "$DIST_DIR" && pwd)
          echo "Found dist folder at: $RESOLVED_DIST"
          echo "dist-path=$RESOLVED_DIST" >> $GITHUB_OUTPUT
          echo "RENPY_DIST_PATH=$RESOLVED_DIST" >> $GITHUB_ENV
        else
          echo "::warning::Could not locate output *-dists directory"
          echo "dist-path=" >> $GITHUB_OUTPUT
        fi
        echo "::endgroup::"

    - name: Upload Artifact
      if: ${{ inputs.build == 'true' && inputs.upload-artifact == 'true' && steps.build-dist.outputs.dist-path != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.build-dist.outputs.dist-path }}

    - name: Publish GitHub Release
      id: publish-release
      if: ${{ inputs.build == 'true' && inputs.create-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "::group::Publishing to GitHub Release"
        TAG="${{ inputs.release-tag }}"
        if [ -z "$TAG" ]; then
          TAG="${GITHUB_REF_NAME}"
        fi

        NAME="${{ inputs.release-name }}"
        if [ -z "$NAME" ]; then
          NAME="$TAG"
        fi

        FILES=()
        if [ -n "$RENPY_DIST_PATH" ] && [ -d "$RENPY_DIST_PATH" ]; then
          while IFS= read -r file; do
            [ -f "$file" ] && FILES+=("$file")
          done < <(find "$RENPY_DIST_PATH" -maxdepth 2 -type f \( -name "*.zip" -o -name "*.tar.bz2" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.dmg" -o -name "*.apk" -o -name "*.sh" \))
        fi

        FLAGS=()
        if [ "${{ inputs.release-draft }}" = "true" ]; then
          FLAGS+=(--draft)
        fi
        if [ "${{ inputs.release-prerelease }}" = "true" ]; then
          FLAGS+=(--prerelease)
        fi
        if [ -n "${{ inputs.release-body }}" ]; then
          FLAGS+=(--notes "${{ inputs.release-body }}")
        else
          FLAGS+=(--generate-notes)
        fi

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release '$TAG' already exists. Uploading assets..."
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi
        else
          echo "Creating new release '$TAG'..."
          gh release create "$TAG" "${FILES[@]}" --title "$NAME" "${FLAGS[@]}"
        fi

        RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "")
        echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT
        echo "Release ready at: $RELEASE_URL"
        echo "::endgroup::"

    - name: Publish to itch.io (Butler)
      if: ${{ inputs.build == 'true' && inputs.publish-itch == 'true' }}
      shell: bash
      run: |
        echo "::group::Publishing to itch.io via Butler"
        
        API_KEY="${{ inputs.butler-key }}"
        if [ -z "$API_KEY" ]; then
          API_KEY="$BUTLER_API_KEY"
        fi

        if [ -z "$API_KEY" ]; then
          echo "::error::publish-itch is enabled but no Butler API key was provided (set butler-key input or BUTLER_API_KEY environment variable/secret)."
          exit 1
        fi
        export BUTLER_API_KEY="$API_KEY"

        TARGET="${{ inputs.itch-target }}"
        if [ -z "$TARGET" ]; then
          echo "Searching for build.itch_project in game scripts..."
          TARGET=$(grep -rohP 'build\.itch_project\s*=\s*["\x27]\K[^"\x27]+' "${{ inputs.game-dir }}" 2>/dev/null | head -n 1 || true)
        fi

        if [ -z "$TARGET" ]; then
          echo "::error::itch-target is required (specify itch-target: 'user/game' or define build.itch_project in your Ren'Py scripts)."
          exit 1
        fi
        echo "itch.io target: $TARGET"

        if ! command -v butler &>/dev/null; then
          echo "Installing Butler CLI (Linux amd64)..."
          curl -L -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler-bin
          sudo install -m 755 /tmp/butler-bin/butler /usr/local/bin/butler
          rm -rf /tmp/butler.zip /tmp/butler-bin
        fi
        butler -V

        USERVERSION="${{ inputs.itch-userversion }}"
        if [ -z "$USERVERSION" ]; then
          USERVERSION="${{ inputs.release-tag }}"
        fi
        if [ -z "$USERVERSION" ]; then
          USERVERSION="${GITHUB_REF_NAME}"
        fi
        echo "Version string: $USERVERSION"

        FILES=()
        if [ -n "$RENPY_DIST_PATH" ] && [ -d "$RENPY_DIST_PATH" ]; then
          while IFS= read -r f; do
            [ -f "$f" ] && FILES+=("$f")
          done < <(find "$RENPY_DIST_PATH" -maxdepth 2 -type f \( -name "*.zip" -o -name "*.tar.bz2" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.apk" \))
        fi

        if [ ${#FILES[@]} -eq 0 ]; then
          echo "::error::No distribution files found in $RENPY_DIST_PATH to upload to itch.io."
          exit 1
        fi

        SPECIFIED_CHANNEL="${{ inputs.itch-channel }}"
        for file in "${FILES[@]}"; do
          filename=$(basename "$file")
          if [ -n "$SPECIFIED_CHANNEL" ]; then
            channel="$SPECIFIED_CHANNEL"
          else
            base_no_ext="${filename%.*}"
            base_no_ext="${base_no_ext%.tar}"
            channel=$(echo "$base_no_ext" | sed -E 's/.*-([a-zA-Z0-9_]+)$/\1/')
            if [ -z "$channel" ] || [ "$channel" = "$base_no_ext" ]; then
              channel="default"
            fi
          fi

          echo "🚀 Pushing '$filename' to '$TARGET:$channel' (version: $USERVERSION)..."
          butler push "$file" "$TARGET:$channel" --userversion "$USERVERSION"
        done

        echo "✅ All packages pushed to itch.io successfully!"
        echo "::endgroup::"

    - name: Publish to Steam (SteamPipe & DRM)
      if: ${{ inputs.build == 'true' && inputs.publish-steam == 'true' }}
      shell: bash
      env:
        STEAM_APP_ID: ${{ inputs.steam-appid }}
        STEAM_DEPOT_ID: ${{ inputs.steam-depot-id }}
        STEAM_USERNAME: ${{ inputs.steam-username }}
        STEAM_PASSWORD: ${{ inputs.steam-password }}
        STEAM_GUARD_CODE: ${{ inputs.steam-guard-code }}
        STEAM_BRANCH: ${{ inputs.steam-branch }}
        STEAM_DESC: ${{ inputs.steam-desc }}
        STEAM_WRAP_DRM: ${{ inputs.steam-wrap-drm }}
        STEAM_DRM_FLAGS: ${{ inputs.steam-drm-flags }}
        STEAM_CONTENT_ROOT: ${{ inputs.steam-content-root }}
        RENPY_DIST_PATH: ${{ steps.build-dist.outputs.dist-path }}
      run: |
        node "${{ github.action_path }}/scripts/steam-deploy.mjs"
